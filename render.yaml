services:
  - type: web
    name: salon-queue-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:server
    startCommand: node dist/server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_ORIGIN
        sync: false
      - key: STAFF_PIN
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/server/data/salon.db
    disk:
      name: salon-queue-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
